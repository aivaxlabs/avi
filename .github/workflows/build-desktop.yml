name: Build desktop releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            package-args: --x64
            artifact-name: avi-build-windows-x64
            output-name: Avi-windows-${arch}.${ext}
          - name: Windows arm64
            os: windows-latest
            package-args: --arm64
            artifact-name: avi-build-windows-arm64
            output-name: Avi-windows-${arch}.${ext}
          - name: Linux x64
            os: ubuntu-latest
            package-args: --x64
            artifact-name: avi-build-linux-x64
            output-name: Avi-linux-${arch}.${ext}
          - name: Linux arm64
            os: ubuntu-latest
            package-args: --arm64
            artifact-name: avi-build-linux-arm64
            output-name: Avi-linux-${arch}.${ext}
          - name: macOS x64 and arm64
            os: macos-latest
            package-args: --x64 --arm64
            artifact-name: avi-build-macos
            output-name: Avi-macos-${arch}.${ext}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Allow Cascadium execution
        if: runner.os != 'Windows'
        run: chmod +x node_modules/@cypherpotato/cascadium/dist/*/cascadium

      - name: Build installers
        run: bun run package -- ${{ matrix.package-args }} --publish never --config.artifactName='${{ matrix.output-name }}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Create release bundle
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Merge installers into one flat ZIP
        uses: actions/upload-artifact/merge@v4
        with:
          name: avi-release
          pattern: avi-build-*
          separate-directories: false
          delete-merged: true
          retention-days: 14
